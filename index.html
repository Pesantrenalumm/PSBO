<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PSB Pondok Pesantren Al-Umm</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tailwind Custom Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#e6f4ea',
              100: '#c3e4cd',
              500: '#1b804e',
              700: '#0f5834',
              800: '#0b4126',
              900: '#062b19',
              950: '#03190e'
            }
          }
        }
      }
    }
  </script>

  <!-- HTML2PDF CDN for PDF Download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Alpine.js CDN -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    [x-cloak] { display: none !important; }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    /* Glassmorphism Styles */
    .glass-card {
      background: rgba(15, 88, 52, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .glass-input {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(209, 213, 219, 0.8);
      transition: all 0.2s ease-in-out;
    }
    .glass-input:focus {
      background: #ffffff;
      border-color: #1b804e;
      box-shadow: 0 0 0 3px rgba(27, 128, 78, 0.2);
    }

    /* Skeleton Animation */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .animate-skeleton {
      animation: pulse 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-emerald-500 selection:text-white relative overflow-x-hidden">

  <!-- Background Gradient & Overlay Patterns -->
  <div class="fixed inset-0 bg-gradient-to-br from-emerald-950 via-slate-950 to-brand-950 -z-10"></div>
  <div class="fixed inset-0 bg-[radial-gradient(ellipse_at_top_left,_var(--tw-gradient-stops))] from-emerald-800/20 via-transparent to-transparent -z-10 pointer-events-none"></div>

  <!-- Main Alpine App Context -->
  <div x-data="psbApp()" x-init="initApp()" x-cloak class="min-h-screen flex flex-col justify-center items-center p-3 sm:p-6 md:p-10">

    <!-- Toast Notification Custom UI -->
    <div x-show="toast.show" x-transition 
         class="fixed top-5 right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl text-sm font-medium border"
         :class="toast.type === 'error' ? 'bg-rose-900/90 text-rose-100 border-rose-700/50' : 'bg-emerald-900/90 text-emerald-100 border-emerald-700/50'">
      <i :data-lucide="toast.type === 'error' ? 'alert-circle' : 'check-circle-2'" class="w-5 h-5 flex-shrink-0"></i>
      <span x-text="toast.message"></span>
      <button @click="toast.show = false" class="ml-2 hover:opacity-75">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- MAIN CONTAINER BOX -->
    <div class="w-full max-w-6xl rounded-3xl glass-card shadow-2xl overflow-hidden border border-white/10 flex flex-col my-auto transition-all duration-300">
      
      <!-- FULL SKELETON LOADER STATE -->
      <template x-if="isLoadingInitial">
        <div class="grid grid-cols-1 md:grid-cols-12 min-h-[620px]">
          <!-- Left Skeleton -->
          <div class="md:col-span-5 bg-emerald-900/40 p-8 flex flex-col justify-between border-b md:border-b-0 md:border-r border-white/10">
            <div class="space-y-6">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-white/10 animate-skeleton"></div>
                <div class="space-y-2">
                  <div class="w-28 h-4 bg-white/10 rounded animate-skeleton"></div>
                  <div class="w-36 h-3 bg-white/10 rounded animate-skeleton"></div>
                </div>
              </div>
              <div class="w-3/4 h-8 bg-white/10 rounded-lg animate-skeleton mt-8"></div>
              <div class="w-full h-16 bg-white/10 rounded-xl animate-skeleton mt-4"></div>
              <div class="w-full h-32 bg-white/10 rounded-2xl animate-skeleton mt-6"></div>
            </div>
            <div class="w-full h-12 bg-white/10 rounded-xl animate-skeleton mt-8"></div>
          </div>
          <!-- Right Skeleton -->
          <div class="md:col-span-7 bg-white/95 p-8 md:p-12 flex flex-col justify-center space-y-6">
            <div class="w-48 h-8 bg-slate-200 rounded-lg animate-skeleton"></div>
            <div class="w-64 h-4 bg-slate-200 rounded animate-skeleton"></div>
            <div class="space-y-4 mt-6">
              <div class="w-full h-12 bg-slate-200 rounded-xl animate-skeleton"></div>
              <div class="w-full h-12 bg-slate-200 rounded-xl animate-skeleton"></div>
              <div class="w-full h-12 bg-emerald-700/30 rounded-xl animate-skeleton mt-6"></div>
            </div>
          </div>
        </div>
      </template>

      <!-- ACTIVE APP UI (After initial load) -->
      <template x-if="!isLoadingInitial">
        <div class="grid grid-cols-1 md:grid-cols-12 min-h-[620px] transition-all duration-300">

          <!-- ========================================================= -->
          <!-- LEFT PANEL (SOLID GREEN GRADIENT & INFORMATION/STEPS)     -->
          <!-- ========================================================= -->
          <div class="md:col-span-5 bg-gradient-to-br from-emerald-900 via-brand-800 to-teal-950 p-6 md:p-8 flex flex-col justify-between relative border-b md:border-b-0 md:border-r border-white/10 order-1 md:order-1">
            
            <div>
              <!-- HEADER BRANDING -->
              <div class="flex items-center gap-3.5 mb-8">
                <div class="w-12 h-12 rounded-2xl bg-white/10 border border-white/20 flex items-center justify-center text-emerald-300 shadow-inner">
                  <i data-lucide="graduation-cap" class="w-7 h-7"></i>
                </div>
                <div>
                  <h1 class="text-xl font-bold tracking-tight text-white leading-tight">PSB AL-UMM</h1>
                  <p class="text-xs text-emerald-200/80 font-medium">Pondok Pesantren Al-Umm</p>
                </div>
              </div>

              <!-- MODE A: LOGIN PANEL LEFT SIDE -->
              <div x-show="mode === 'login'" 
                   x-transition:enter="transition ease-out duration-300"
                   x-transition:enter-start="opacity-0 -translate-x-4"
                   x-transition:enter-end="opacity-100 translate-x-0"
                   class="space-y-6">
                <!-- Tag Promo -->
                <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-amber-500/20 border border-amber-400/30 text-amber-300 text-xs font-semibold tracking-wide uppercase">
                  <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                  <span>PENERIMAAN SANTRI BARU</span>
                </div>

                <h2 class="text-2xl md:text-3xl font-extrabold text-white leading-snug">
                  Tahun Ajaran <span class="text-amber-300" x-text="config.TAHUN_AJARAN || '2027/2028'"></span>
                </h2>
                <p class="text-xs md:text-sm text-emerald-100/80 leading-relaxed">
                  Satu portal terpadu untuk calon santri baru dan panitia pendaftaran santri baru Pondok Pesantren Al-Umm.
                </p>

                <!-- DYNAMIC CAROUSEL SLIDE -->
                <div class="mt-6 glass-panel rounded-2xl p-4 md:p-5 relative overflow-hidden">
                  <template x-for="(slide, index) in slides" :key="slide.id">
                    <div x-show="currentSlideIndex === index" x-transition.opacity.duration.300ms class="space-y-2">
                      <div class="flex items-center justify-between">
                        <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-amber-400/20 text-amber-300 border border-amber-400/30" x-text="slide.badge"></span>
                        <span class="text-[11px] text-emerald-200/60 font-mono" x-text="(index + 1) + '/' + slides.length"></span>
                      </div>
                      <h4 class="text-sm font-bold text-white" x-text="slide.title"></h4>
                      <p class="text-xs text-emerald-100/80 leading-relaxed" x-text="slide.content"></p>
                    </div>
                  </template>

                  <!-- Slide Controls Dots -->
                  <div class="flex items-center gap-1.5 mt-4 pt-2 border-t border-white/10" x-show="slides.length > 1">
                    <template x-for="(slide, index) in slides" :key="'dot-' + slide.id">
                      <button @click="currentSlideIndex = index" 
                              class="h-1.5 rounded-full transition-all duration-300"
                              :class="currentSlideIndex === index ? 'w-6 bg-amber-400' : 'w-1.5 bg-white/30 hover:bg-white/50'"></button>
                    </template>
                  </div>
                </div>
              </div>

              <!-- MODE B: REGISTER PANEL LEFT SIDE (STEP INDICATOR) -->
              <div x-show="mode === 'register'" 
                   x-transition:enter="transition ease-out duration-300"
                   x-transition:enter-start="opacity-0 translate-x-4"
                   x-transition:enter-end="opacity-100 translate-x-0"
                   class="space-y-6">
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                  <i data-lucide="clipboard-list" class="w-5 h-5 text-emerald-400"></i>
                  <span>Tahapan Pendaftaran</span>
                </h3>
                <p class="text-xs text-emerald-100/80">Lengkapi formulir singkat untuk membuka akun pendaftaran Anda.</p>

                <!-- Steps List -->
                <div class="space-y-4 mt-6">
                  <!-- Step 1 Indicator -->
                  <div class="flex items-center gap-4 p-3 rounded-xl transition-all"
                       :class="registerStep === 1 ? 'bg-white/15 border border-white/20' : 'opacity-60'">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs"
                         :class="registerStep === 1 ? 'bg-amber-400 text-slate-900' : (registerStep > 1 ? 'bg-emerald-500 text-white' : 'bg-white/20 text-white')">
                      <template x-if="registerStep > 1">
                        <i data-lucide="check" class="w-4 h-4"></i>
                      </template>
                      <template x-if="registerStep <= 1">
                        <span>1</span>
                      </template>
                    </div>
                    <div>
                      <div class="text-xs font-bold text-white">Jalur & Jenjang</div>
                      <div class="text-[11px] text-emerald-200/70">Pilih program & kelas tujuan</div>
                    </div>
                  </div>

                  <!-- Step 2 Indicator -->
                  <div class="flex items-center gap-4 p-3 rounded-xl transition-all"
                       :class="registerStep === 2 ? 'bg-white/15 border border-white/20' : 'opacity-60'">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs"
                         :class="registerStep === 2 ? 'bg-amber-400 text-slate-900' : (registerStep > 2 ? 'bg-emerald-500 text-white' : 'bg-white/20 text-white')">
                      <template x-if="registerStep > 2">
                        <i data-lucide="check" class="w-4 h-4"></i>
                      </template>
                      <template x-if="registerStep <= 2">
                        <span>2</span>
                      </template>
                    </div>
                    <div>
                      <div class="text-xs font-bold text-white">Data Singkat</div>
                      <div class="text-[11px] text-emerald-200/70">Identitas diri & kontak WA</div>
                    </div>
                  </div>

                  <!-- Step 3 Indicator -->
                  <div class="flex items-center gap-4 p-3 rounded-xl transition-all"
                       :class="registerStep === 3 ? 'bg-white/15 border border-white/20' : 'opacity-60'">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs"
                         :class="registerStep === 3 ? 'bg-amber-400 text-slate-900' : 'bg-white/20 text-white'">
                      <span>3</span>
                    </div>
                    <div>
                      <div class="text-xs font-bold text-white">Persetujuan</div>
                      <div class="text-[11px] text-emerald-200/70">Konfirmasi syarat & ketentuan</div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- MODE C: SUCCESS PANEL LEFT SIDE -->
              <div x-show="mode === 'success'" 
                   x-transition:enter="transition ease-out duration-300"
                   x-transition:enter-start="opacity-0 scale-95"
                   x-transition:enter-end="opacity-100 scale-100"
                   class="space-y-6">
                <div class="w-16 h-16 rounded-full bg-emerald-500/20 border border-emerald-400/40 flex items-center justify-center text-emerald-400 mb-4">
                  <i data-lucide="check-circle" class="w-10 h-10"></i>
                </div>
                <h3 class="text-2xl font-extrabold text-white">Akun Berhasil Dibuat!</h3>
                <p class="text-xs text-emerald-100/80 leading-relaxed">
                  Selamat, pembuatan akun calon santri berhasil. Simpan kredensial Anda untuk masuk ke portal seleksi santri baru.
                </p>
              </div>
            </div>

            <!-- FOOTER BUTTONS ON LEFT SIDE -->
            <div class="mt-8 pt-6 border-t border-white/10 space-y-3">
              <div class="grid grid-cols-2 gap-2">
                <!-- Download Brosur Button -->
                <a :href="config.LINK_BROSUR || '#'" target="_blank" 
                   class="flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-xs transition shadow-md">
                  <i data-lucide="file-down" class="w-4 h-4"></i>
                  <span>Brosur PSB</span>
                </a>
                <!-- Helpdesk WA Button -->
                <a :href="'https://wa.me/' + (config.HELPDESK_WA || '6281234567890') + '?text=Assalamu%27alaikum%20Panitia%20PSB%20Al-Umm'" target="_blank"
                   class="flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white font-semibold text-xs border border-white/20 transition">
                  <i data-lucide="message-square" class="w-4 h-4 text-emerald-400"></i>
                  <span>Helpdesk WA</span>
                </a>
              </div>
              <div class="flex items-center justify-between text-[11px] text-emerald-200/50 pt-2">
                <span>&copy; 2027 Pesantren Al-Umm</span>
                <span>v1.0</span>
              </div>
            </div>

          </div>

          <!-- ========================================================= -->
          <!-- RIGHT PANEL (FORM CONTAINER / SUCCESS CREDENTIAL DISPLAY)  -->
          <!-- ========================================================= -->
          <div class="md:col-span-7 bg-white text-slate-800 p-6 sm:p-8 md:p-10 flex flex-col justify-center order-2 md:order-2 relative">

            <!-- ------------------------------------------------------- -->
            <!-- VIEW 1: LOGIN FORM                                       -->
            <!-- ------------------------------------------------------- -->
            <div x-show="mode === 'login'" 
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 translate-y-3"
                 x-transition:enter-end="opacity-100 translate-y-0">
              <div class="mb-8">
                <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Masuk ke Akun</h2>
                <p class="text-xs text-slate-500 mt-1">Gunakan No Registrasi (contoh: PSB2027-0001), No WA, atau Email Anda.</p>
              </div>

              <form @submit.prevent="handleLogin()" novalidate class="space-y-5">
                <!-- Identifier Input -->
                <div>
                  <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">No Registrasi / WA / Email</label>
                  <div class="relative">
                    <i data-lucide="user" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" 
                           x-model="loginForm.identifier"
                           @input="loginForm.identifier = loginForm.identifier.toUpperCase()"
                           placeholder="PSB2027-0001 / 081234... / email@domain.com"
                           class="w-full pl-11 pr-4 py-3 rounded-xl text-sm font-semibold uppercase glass-input text-slate-800 placeholder-slate-400 focus:outline-none"
                           required>
                  </div>
                </div>

                <!-- Password Input -->
                <div>
                  <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Password</label>
                  <div class="relative">
                    <i data-lucide="lock" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input :type="showPassword ? 'text' : 'password'" 
                           x-model="loginForm.password"
                           placeholder="••••••••"
                           class="w-full pl-11 pr-11 py-3 rounded-xl text-sm glass-input text-slate-800 placeholder-slate-400 focus:outline-none"
                           required>
                    <button type="button" @click="showPassword = !showPassword" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                      <i :data-lucide="showPassword ? 'eye-off' : 'eye'" class="w-5 h-5"></i>
                    </button>
                  </div>
                </div>

                <!-- Remember Me & Forgot -->
                <div class="flex items-center justify-between text-xs pt-1">
                  <label class="flex items-center gap-2 text-slate-600 cursor-pointer">
                    <input type="checkbox" x-model="loginForm.remember" class="rounded text-brand-700 focus:ring-brand-500 w-4 h-4">
                    <span>Ingat Saya</span>
                  </label>
                  <button type="button" @click="showHelpModal = true" class="text-brand-700 font-semibold hover:underline">Lupa Password?</button>
                </div>

                <!-- Login Button -->
                <button type="submit" 
                        :disabled="isSubmitting"
                        class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-brand-700 to-emerald-600 hover:from-brand-800 hover:to-emerald-700 text-white font-bold text-sm shadow-lg shadow-emerald-900/20 flex items-center justify-center gap-2 transition disabled:opacity-60 disabled:cursor-not-allowed">
                  <template x-if="isSubmitting">
                    <div class="flex items-center gap-2">
                      <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                      <span>Memproses...</span>
                    </div>
                  </template>
                  <template x-if="!isSubmitting">
                    <div class="flex items-center gap-2">
                      <span>Masuk Sekarang</span>
                      <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </div>
                  </template>
                </button>
              </form>

              <!-- Switch to Register Link -->
              <div class="mt-8 text-center text-xs text-slate-600 pt-6 border-t border-slate-100">
                Belum memiliki akun pendaftaran? 
                <button type="button" @click="switchToRegister()" class="text-brand-700 font-bold hover:underline ml-1">
                  Buat Akun Baru
                </button>
              </div>
            </div>

            <!-- ------------------------------------------------------- -->
            <!-- VIEW 2: MULTI-STEP REGISTRATION FORM                    -->
            <!-- ------------------------------------------------------- -->
            <div x-show="mode === 'register'" 
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 translate-y-3"
                 x-transition:enter-end="opacity-100 translate-y-0">
              
              <!-- Back to Login Header -->
              <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-100">
                <div>
                  <h2 class="text-xl font-bold text-slate-900">Formulir Pendaftaran</h2>
                  <p class="text-xs text-slate-500">Langkah <span x-text="registerStep"></span> dari 3</p>
                </div>
                <button type="button" @click="switchToLogin()" class="text-xs text-slate-500 hover:text-slate-800 font-semibold flex items-center gap-1 bg-slate-100 px-3 py-1.5 rounded-lg transition hover:bg-slate-200">
                  <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                  <span>Kembali Login</span>
                </button>
              </div>

              <!-- FORM CONTENT BY STEP -->
              <form @submit.prevent="handleRegisterStepSubmit()" novalidate>
                
                <!-- STEP 1: Pilih Jalur & Jenjang -->
                <div x-show="registerStep === 1" class="space-y-5">
                  <!-- Jalur Selection -->
                  <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Pilih Jalur Pendaftaran</label>
                    <div class="grid grid-cols-3 gap-2">
                      <template x-for="j in ['Reguler', 'Mutasi', 'Inden']" :key="j">
                        <button type="button" 
                                @click="regForm.jalur = j; onJalurChange()"
                                class="py-3 px-3 rounded-xl border text-center text-xs font-bold transition flex flex-col items-center justify-center gap-1"
                                :class="regForm.jalur === j ? 'bg-brand-50 border-brand-700 text-brand-800 ring-2 ring-brand-700/20' : 'border-slate-200 text-slate-600 hover:bg-slate-50'">
                          <span x-text="j"></span>
                        </button>
                      </template>
                    </div>
                  </div>

                  <!-- Options for REGULER -->
                  <template x-if="regForm.jalur === 'Reguler'">
                    <div>
                      <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Pilih Jenjang Sekolah</label>
                      <div class="grid grid-cols-2 gap-3">
                        <template x-for="jn in ['SMP', 'MA']" :key="jn">
                          <button type="button" 
                                  @click="regForm.jenjang = jn; regForm.kelasTujuan = 'Kelas 7' === (jn === 'SMP' ? 'Kelas 7' : 'Kelas 10') ? 'Kelas 7' : 'Kelas 10'"
                                  class="py-3 px-4 rounded-xl border text-center text-xs font-bold transition"
                                  :class="regForm.jenjang === jn ? 'bg-brand-700 text-white border-brand-700' : 'border-slate-200 text-slate-700 hover:bg-slate-50'">
                            <span x-text="jn === 'SMP' ? 'SMP Al-Umm' : 'MA Al-Umm'"></span>
                          </button>
                        </template>
                      </div>
                    </div>
                  </template>

                  <!-- Options for MUTASI -->
                  <template x-if="regForm.jalur === 'Mutasi'">
                    <div class="space-y-4">
                      <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Pilih Jenjang Sekolah</label>
                        <div class="grid grid-cols-2 gap-3">
                          <button type="button" @click="regForm.jenjang = 'SMP'; regForm.kelasTujuan = 'Kelas 7'"
                                  class="py-2.5 px-3 rounded-xl border text-xs font-bold text-center"
                                  :class="regForm.jenjang === 'SMP' ? 'bg-brand-700 text-white border-brand-700' : 'border-slate-200 text-slate-700'">
                            SMP Al-Umm
                          </button>
                          <button type="button" @click="regForm.jenjang = 'MA'; regForm.kelasTujuan = 'Kelas 10'"
                                  class="py-2.5 px-3 rounded-xl border text-xs font-bold text-center"
                                  :class="regForm.jenjang === 'MA' ? 'bg-brand-700 text-white border-brand-700' : 'border-slate-200 text-slate-700'">
                            MA Al-Umm
                          </button>
                        </div>
                      </div>

                      <div x-show="regForm.jenjang === 'SMP'">

          <a :href="'https://wa.me/' + (config.HELPDESK_WA || '6281234567890') + '?text=Assalamu%27alaikum%20Panitia%20PSB%20Lupa%20Password'" target="_blank"
             class="w-full py-2.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs flex items-center justify-center gap-2 transition">
            <i data-lucide="message-square" class="w-4 h-4"></i>
            <span>Hubungi Helpdesk WA</span>

  <!-- Alpine.js Application Logic -->
  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwmLCxEBouo85NhcZvNY13y0qM8CuKBZ-ImohX9c-UeWYFli9v32gU4JNNfPBPiPQB02Q/exec';

    function psbApp() {
      return {
        isLoadingInitial: true,
        isSubmitting: false,
        showHelpModal: false,
        showPassword: false,
        mode: 'login', // 'login' | 'register' | 'success'
        registerStep: 1,

        currentSlideIndex: 0,
        slideInterval: null,

        config: {
          TAHUN_AJARAN: '2027/2028',
          LINK_BROSUR: '#',
          HELPDESK_WA: '6281234567890'
        },

        slides: [
          { id: '1', badge: 'PROMO EARLY BIRD DIBUKA!', title: 'Penerimaan Santri Baru', content: 'Dapatkan Potongan Khusus Biaya Pendaftaran! Cukup buat akun & kunci kuota sebelum Gelombang I dibuka.' }
        ],

        loginForm: {
          identifier: '',
          password: '',
          remember: true
        },

        regForm: {
          jalur: 'Reguler',
          jenjang: 'SMP',
          kelasTujuan: 'Kelas 7',
          namaLengkap: '',
          jenisKelamin: 'LAKI-LAKI',
          asalSekolah: '',
          noWa: '',
          email: '',
          agreeTerms: false,
          agreeProcess: false,
          agreeValidData: false
        },

        registeredData: {
          regNo: '',
          namaLengkap: '',
          jenisKelamin: '',
          jalur: '',
          jenjang: '',
          noWa: '',
          email: '',
          autoPass: ''
        },

        toast: {
          show: false,
          type: 'error',
          message: ''
        },

        initApp() {
          this.fetchInitialData();
          this.startSlideTimer();
          this.$nextTick(function() {
            if (window.lucide) window.lucide.createIcons();
          });
        },

        showToast(msg, type) {
          type = type || 'error';
          this.toast.message = msg;
          this.toast.type = type;
          this.toast.show = true;
          var self = this;
          setTimeout(function() {
            self.toast.show = false;
          }, 4500);
        },

        startSlideTimer() {
          var self = this;
          if (this.slideInterval) clearInterval(this.slideInterval);
          this.slideInterval = setInterval(function() {
            if (self.slides && self.slides.length > 1 && self.mode === 'login') {
              self.currentSlideIndex = (self.currentSlideIndex + 1) % self.slides.length;
            }
          }, 5000);
        },

        postRequest(action, payload) {
          return fetch(SCRIPT_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify({ action: action, payload: payload || {} })
          })
          .then(function(res) { return res.text(); })
          .then(function(txt) {
            try {
              return JSON.parse(txt);
            } catch (err) {
              throw new Error('Gagal memproses respon server.');
            }
          });
        },

        fetchInitialData() {
          var self = this;
          this.isLoadingInitial = true;
          this.postRequest('getInitialData', {})
            .then(function(res) {
              self.isLoadingInitial = false;
              if (res.ok && res.data) {
                if (res.data.config) self.config = Object.assign({}, self.config, res.data.config);
                if (res.data.slides && res.data.slides.length > 0) self.slides = res.data.slides;
              }
              self.$nextTick(function() {
                if (window.lucide) window.lucide.createIcons();
              });
            })
            .catch(function(err) {
              self.isLoadingInitial = false;
              self.showToast('Gagal memuat konfigurasi awal: ' + err.message);
            });
        },

        sanitizeWaInput(val) {
          if (!val) return '';
          var cleaned = val.replace(/\D/g, '');
          if (cleaned.startsWith('62')) {
            cleaned = '0' + cleaned.substring(2);
          }
          return cleaned;
        },

        switchToRegister() {
          this.mode = 'register';
          this.registerStep = 1;
          this.$nextTick(function() {
            if (window.lucide) window.lucide.createIcons();
          });
        },

        switchToLogin() {
          this.mode = 'login';
          this.$nextTick(function() {
            if (window.lucide) window.lucide.createIcons();
          });
        },

        switchToLoginWithUser() {
          var self = this;
          this.loginForm.identifier = this.registeredData.regNo;
          this.loginForm.password = this.registeredData.autoPass;
          this.mode = 'login';
          this.showToast('Kredensial ' + this.registeredData.regNo + ' siap. Klik Masuk!', 'success');
          this.$nextTick(function() {
            if (window.lucide) window.lucide.createIcons();
          });
        },

        registerAnotherChild() {
          var preservedWa = this.registeredData.noWa || this.regForm.noWa;
          var preservedEmail = this.registeredData.email || this.regForm.email;
          var preservedSekolah = this.regForm.asalSekolah;

          this.regForm = {
            jalur: 'Reguler',
            jenjang: 'SMP',
            kelasTujuan: 'Kelas 7',
            namaLengkap: '',
            jenisKelamin: 'LAKI-LAKI',
            asalSekolah: preservedSekolah,
            noWa: preservedWa,
            email: preservedEmail,
            agreeTerms: false,
            agreeProcess: false,
            agreeValidData: false
          };

          this.registerStep = 1;
          this.mode = 'register';
          this.showToast('Silakan isi data santri kedua / berikutnya.', 'success');
          this.$nextTick(function() {
            if (window.lucide) window.lucide.createIcons();
          });
        },

        onJalurChange() {
          if (this.regForm.jalur === 'Reguler') {
            this.regForm.jenjang = 'SMP';
            this.regForm.kelasTujuan = 'Kelas 7';
          } else if (this.regForm.jalur === 'Mutasi') {
            this.regForm.jenjang = 'SMP';
            this.regForm.kelasTujuan = 'Kelas 7';
          } else if (this.regForm.jalur === 'Inden') {
            this.regForm.jenjang = 'SMP';
            this.regForm.kelasTujuan = 'KELAS 5 SD';
          }
        },

        handleLogin() {
          var self = this;
          this.isSubmitting = true;
          this.postRequest('login', {
            identifier: this.loginForm.identifier,
            password: this.loginForm.password
          })
          .then(function(res) {
            self.isSubmitting = false;
            if (res.ok) {
              self.showToast('Login Berhasil! Role: ' + res.data.role, 'success');
              // Siap untuk pengalihan ke dashboard di tahap selanjutnya
            } else {
              self.showToast(res.message || 'Login gagal');
            }
          })
          .catch(function(err) {
            self.isSubmitting = false;
            self.showToast(err.message || 'Terjadi kesalahan jaringan.');
          });
        },

        handleRegisterStepSubmit() {
          if (this.registerStep === 1) {
            if (!this.regForm.jalur || !this.regForm.jenjang) {
              this.showToast('Silakan pilih Jalur dan Jenjang pendaftaran.');
              return;
            }
            if (this.regForm.jalur === 'Inden' && (!this.regForm.kelasTujuan || !this.regForm.kelasTujuan.trim())) {
              this.showToast('Silakan isi kelas calon santri saat ini.');
              return;
            }
            this.registerStep = 2;
          } else if (this.registerStep === 2) {
            if (!this.regForm.namaLengkap.trim()) {
              this.showToast('Silakan isi nama lengkap santri.');
              return;
            }
            if (!this.regForm.asalSekolah.trim()) {
              this.showToast('Silakan isi asal sekolah santri.');
              return;
            }
            if (!this.regForm.noWa || this.regForm.noWa.length < 9) {
              this.showToast('Nomor WhatsApp tidak valid (minimal 9 digit).');
              return;
            }
            if (!this.regForm.email.trim() || !this.regForm.email.includes('@')) {
              this.showToast('Silakan masukkan alamat email yang valid.');
              return;
            }
            this.registerStep = 3;
          } else if (this.registerStep === 3) {
            if (!this.regForm.agreeTerms || !this.regForm.agreeProcess || !this.regForm.agreeValidData) {
              this.showToast('Anda harus menyetujui seluruh centang persetujuan.');
              return;
            }
            this.executeRegistration();
          }
          this.$nextTick(function() {
            if (window.lucide) window.lucide.createIcons();
          });
        },

        executeRegistration() {
          var self = this;
          this.isSubmitting = true;

          var payload = {
            namaLengkap: this.regForm.namaLengkap,
            jenisKelamin: this.regForm.jenisKelamin,
            jalur: this.regForm.jalur,
            jenjang: this.regForm.jenjang,
            kelasTujuan: this.regForm.kelasTujuan,
            asalSekolah: this.regForm.asalSekolah,
            noWa: this.regForm.noWa,
            email: this.regForm.email
          };

          this.postRequest('register', payload)
            .then(function(res) {
              self.isSubmitting = false;
              if (res.ok) {
                self.registeredData = Object.assign({}, res.data);
                self.mode = 'success';
                self.showToast('Akun berhasil dibuat!', 'success');
              } else {
                self.showToast(res.message || 'Gagal mendaftarkan akun.');
              }
              self.$nextTick(function() {
                if (window.lucide) window.lucide.createIcons();
              });
            })
            .catch(function(err) {
              self.isSubmitting = false;
              self.showToast(err.message || 'Gagal terhubung ke server.');
            });
        },

        downloadPDF() {
          var element = document.getElementById('registrationCard');
          if (!element) return;
          
          var opt = {
            margin:       0.5,
            filename:     'Bukti_Pendaftaran_' + (this.registeredData.regNo || 'PSB') + '.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
          };

          if (window.html2pdf) {
            window.html2pdf().set(opt).from(element).save();
          } else {
            window.print();
          }
        }
      };
    }
  </script>
</body>
</html>
