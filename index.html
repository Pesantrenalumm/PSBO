<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSB Pondok Pesantren Al-Umm</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Alpine.js CDN -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    
    /* Custom Scrollbar for TNC */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #059669;
      border-radius: 4px;
    }

    /* Print Styles for Proof Card */
    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-[#0e1424] font-sans text-slate-800 antialiased min-h-screen flex flex-col" x-data="psbApp()" x-init="initApp()">

  <!-- Toast Notification Custom Modal -->
  <div x-cloak x-show="toast.show" 
       x-transition:enter="transition ease-out duration-300 transform"
       x-transition:enter-start="opacity-0 translate-y-2"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-200 transform"
       x-transition:leave-start="opacity-100 translate-y-0"
       x-transition:leave-end="opacity-0 translate-y-2"
       class="fixed top-5 right-5 z-50 max-w-sm w-full bg-white shadow-xl rounded-xl border border-slate-200 p-4 flex items-start space-x-3">
    <div :class="toast.type === 'error' ? 'bg-red-100 text-red-600' : 'bg-emerald-100 text-emerald-600'" class="p-2 rounded-lg flex-shrink-0">
      <i :data-lucide="toast.type === 'error' ? 'alert-circle' : 'check-circle-2'" class="w-5 h-5"></i>
    </div>
    <div class="flex-1 pr-2">
      <h4 class="text-sm font-semibold text-slate-900" x-text="toast.title"></h4>
      <p class="text-xs text-slate-600 mt-0.5" x-text="toast.message"></p>
    </div>
    <button @click="toast.show = false" class="text-slate-400 hover:text-slate-600">
      <i data-lucide="x" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- Loading Full Overlay (Blocker operations) -->
  <div x-cloak x-show="isPageBlocking" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center">
    <div class="bg-white p-6 rounded-2xl shadow-2xl flex flex-col items-center space-y-3">
      <svg class="animate-spin h-10 w-10 text-emerald-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span class="text-sm font-medium text-slate-700" x-text="loadingMessage">Memproses data...</span>
    </div>
  </div>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 flex items-center justify-center p-3 sm:p-6 md:p-10">
    <div class="w-full max-w-6xl bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200 min-h-[640px] flex flex-col md:flex-row transition-all duration-300">
      
      <!-- ================= 1. MOBILE TOP HEADER (Khusus Mobile & Tablet) ================= -->
      <div class="md:hidden bg-gradient-to-br from-emerald-900 via-emerald-800 to-teal-950 text-white p-5 relative overflow-hidden border-b border-emerald-800">
        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:16px_16px] pointer-events-none"></div>
        <div class="relative z-10 flex flex-col space-y-3">
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-emerald-600/60 backdrop-blur border border-emerald-400/30 rounded-xl flex items-center justify-center text-emerald-200 shadow-inner">
              <i data-lucide="graduation-cap" class="w-6 h-6"></i>
            </div>
            <div>
              <h1 class="font-bold text-base leading-tight text-white tracking-wide">AL-UMM</h1>
              <p class="text-[11px] text-emerald-200/80 font-medium">Pondok Pesantren &amp; Madrasah</p>
            </div>
          </div>
          <div>
            <div class="inline-flex items-center space-x-2 bg-emerald-700/50 border border-emerald-500/30 rounded-full px-3 py-1 text-[11px] text-emerald-100 font-medium">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span>PSB Tahun Ajaran <strong x-text="config.TAHUN_AJARAN || '2025/2026'"></strong></span>
            </div>
          </div>
        </div>
      </div>

      <!-- ================= 2. DESKTOP LEFT PANEL (Khusus Layar Komputer / Desktop) ================= -->
      <div class="hidden md:flex md:w-5/12 bg-gradient-to-br from-emerald-900 via-emerald-800 to-teal-950 text-white p-6 sm:p-8 flex-col justify-between relative overflow-hidden transition-all duration-500">
        <!-- Pattern background overlay -->
        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:16px_16px] pointer-events-none"></div>

        <!-- HEADER / LOGO DESKTOP -->
        <div class="relative z-10">
          <div class="flex items-center space-x-3">
            <div class="w-12 h-12 bg-emerald-600/60 backdrop-blur border border-emerald-400/30 rounded-2xl flex items-center justify-center text-emerald-200 shadow-inner">
              <i data-lucide="graduation-cap" class="w-7 h-7"></i>
            </div>
            <div>
              <h1 class="font-bold text-lg leading-tight text-white tracking-wide">AL-UMM</h1>
              <p class="text-xs text-emerald-200/80 font-medium">Pondok Pesantren &amp; Madrasah</p>
            </div>
          </div>

          <!-- TA Indicator -->
          <div class="mt-4 inline-flex items-center space-x-2 bg-emerald-700/50 border border-emerald-500/30 rounded-full px-3 py-1 text-xs text-emerald-100 font-medium">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>PSB Tahun Ajaran <strong x-text="config.TAHUN_AJARAN || '2025/2026'"></strong></span>
          </div>
        </div>

        <!-- CONTENT PANEL DESKTOP -->
        <template x-if="mode === 'login'">
          <div class="my-8 relative z-10 transition-all duration-300">
            <template x-if="loadingInitial">
              <div class="animate-pulse space-y-3">
                <div class="h-4 bg-emerald-700/50 rounded w-1/3"></div>
                <div class="h-6 bg-emerald-700/50 rounded w-3/4"></div>
                <div class="h-12 bg-emerald-700/50 rounded w-full"></div>
              </div>
            </template>

            <template x-if="!loadingInitial && slides.length > 0">
              <div class="space-y-4">
                <span class="inline-block px-2.5 py-0.5 rounded-md text-[10px] uppercase font-bold tracking-wider bg-amber-400 text-amber-950" x-text="slides[activeSlide].badge"></span>
                <h2 class="text-xl sm:text-2xl font-bold leading-snug text-white" x-text="slides[activeSlide].title"></h2>
                <p class="text-xs sm:text-sm text-emerald-100/80 leading-relaxed" x-text="slides[activeSlide].content"></p>
                
                <div class="flex items-center space-x-2 pt-2">
                  <template x-for="(slide, index) in slides" :key="index">
                    <button @click="activeSlide = index" 
                            class="h-1.5 rounded-full transition-all duration-300"
                            :class="activeSlide === index ? 'w-6 bg-emerald-300' : 'w-2 bg-emerald-700 hover:bg-emerald-600'"></button>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </template>

        <template x-if="mode === 'register'">
          <div class="my-8 relative z-10 space-y-6 transition-all duration-300">
            <div>
              <h2 class="text-xl font-bold text-white">Tahapan Pendaftaran</h2>
              <p class="text-xs text-emerald-200/80 mt-1">Lengkapi data santri baru dengan mudah</p>
            </div>

            <div class="space-y-4">
              <div class="flex items-center space-x-3 p-3 rounded-xl transition-all"
                   :class="regStep === 1 ? 'bg-emerald-700/60 border border-emerald-400/40 text-white shadow' : 'opacity-60 text-emerald-200'">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm"
                     :class="regStep === 1 ? 'bg-emerald-400 text-emerald-950' : 'bg-emerald-800 border border-emerald-600 text-white'">1</div>
                <div>
                  <h4 class="text-xs font-semibold">Jalur &amp; Jenjang</h4>
                  <p class="text-[10px] text-emerald-200/80">Pilihan program studi</p>
                </div>
              </div>

              <div class="flex items-center space-x-3 p-3 rounded-xl transition-all"
                   :class="regStep === 2 ? 'bg-emerald-700/60 border border-emerald-400/40 text-white shadow' : 'opacity-60 text-emerald-200'">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm"
                     :class="regStep === 2 ? 'bg-emerald-400 text-emerald-950' : 'bg-emerald-800 border border-emerald-600 text-white'">2</div>
                <div>
                  <h4 class="text-xs font-semibold">Biodata &amp; NISN</h4>
                  <p class="text-[10px] text-emerald-200/80">Identitas santri &amp; wali</p>
                </div>
              </div>

              <div class="flex items-center space-x-3 p-3 rounded-xl transition-all"
                   :class="regStep === 3 ? 'bg-emerald-700/60 border border-emerald-400/40 text-white shadow' : 'opacity-60 text-emerald-200'">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm"
                     :class="regStep === 3 ? 'bg-emerald-400 text-emerald-950' : 'bg-emerald-800 border border-emerald-600 text-white'">3</div>
                <div>
                  <h4 class="text-xs font-semibold">Persetujuan Syarat</h4>
                  <p class="text-[10px] text-emerald-200/80">Konfirmasi data &amp; ketentuan</p>
                </div>
              </div>
            </div>
          </div>
        </template>

        <!-- FOOTER DESKTOP BUTTONS -->
        <div class="relative z-10 pt-4 border-t border-emerald-700/50 flex flex-col sm:flex-row gap-2">
          <a :href="config.BROCHURE_URL || '#'" target="_blank" 
             class="flex-1 inline-flex items-center justify-center space-x-1.5 px-3 py-2 rounded-xl bg-emerald-800/80 hover:bg-emerald-700 border border-emerald-600/50 text-xs font-medium text-emerald-100 transition shadow-sm">
            <i data-lucide="file-down" class="w-4 h-4 text-emerald-300"></i>
            <span>Brosur PSB</span>
          </a>
          <a :href="'https://wa.me/' + (config.HELPDESK_WA || '6281234567890')" target="_blank"
             class="flex-1 inline-flex items-center justify-center space-x-1.5 px-3 py-2 rounded-xl bg-emerald-800/80 hover:bg-emerald-700 border border-emerald-600/50 text-xs font-medium text-emerald-100 transition shadow-sm">
            <i data-lucide="message-circle" class="w-4 h-4 text-emerald-300"></i>
            <span>Helpdesk WA</span>
          </a>
        </div>
      </div>


      <!-- ================= 3. AREA UTAMA FORM (LOGIN / REGISTRASI / HASIL) ================= -->
      <div class="w-full md:w-7/12 p-6 sm:p-10 flex flex-col justify-center bg-white relative">
        
        <!-- SKELETON LOADING STATE FOR FORM INITIALIZATION -->
        <template x-if="loadingInitial">
          <div class="animate-pulse space-y-6">
            <div class="h-8 bg-slate-200 rounded w-1/2"></div>
            <div class="space-y-4">
              <div class="h-10 bg-slate-200 rounded"></div>
              <div class="h-10 bg-slate-200 rounded"></div>
              <div class="h-12 bg-slate-300 rounded"></div>
            </div>
          </div>
        </template>

        <!-- MAIN VIEW ENGINE -->
        <template x-if="!loadingInitial">
          <div>

            <!-- ================= VIEW 1: LOGIN FORM ================= -->
            <div x-show="mode === 'login'" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100">
              <div class="mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Masuk Portal PSB</h2>
                <p class="text-sm text-slate-500 mt-1">Masuk untuk calon santri terdaftar atau Administrator</p>
              </div>

              <form @submit.prevent="submitLogin()" class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">No WhatsApp / Email / NISN</label>
                  <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                      <i data-lucide="user" class="w-4 h-4"></i>
                    </span>
                    <input type="text" x-model="loginForm.username" required
                           placeholder="Contoh: 081234567890" 
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 outline-none transition">
                  </div>
                </div>

                <div>
                  <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Kata Sandi</label>
                  <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                      <i data-lucide="lock" class="w-4 h-4"></i>
                    </span>
                    <input :type="showPassword ? 'text' : 'password'" x-model="loginForm.password" required
                           placeholder="Masukkan kata sandi" 
                           class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 outline-none transition">
                    <button type="button" @click="showPassword = !showPassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                      <i :data-lucide="showPassword ? 'eye-off' : 'eye'" class="w-4 h-4"></i>
                    </button>
                  </div>
                  <p class="text-[11px] text-slate-400 mt-1">* Password default peserta adalah 4 angka terakhir nomor WhatsApp.</p>
                </div>

                <button type="submit" :disabled="isSubmitting"
                        class="w-full py-3 px-4 bg-emerald-700 hover:bg-emerald-800 active:bg-emerald-900 text-white rounded-xl font-semibold text-sm shadow-lg shadow-emerald-700/20 transition flex items-center justify-center space-x-2 disabled:opacity-50">
                  <template x-if="!isSubmitting">
                    <span class="flex items-center space-x-2">
                      <span>Masuk Sekarang</span>
                      <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </span>
                  </template>
                  <template x-if="isSubmitting">
                    <span class="flex items-center space-x-2">
                      <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                      </svg>
                      <span>Memverifikasi...</span>
                    </span>
                  </template>
                </button>
              </form>

              <div class="mt-6 pt-6 border-t border-slate-200 text-center">
                <p class="text-xs text-slate-600">Belum memiliki akun pendaftaran?</p>
                <button @click="switchMode('register')" 
                        class="mt-2 text-sm font-semibold text-emerald-700 hover:text-emerald-800 inline-flex items-center space-x-1">
                  <span>Buat Akun Santri Baru</span>
                  <i data-lucide="user-plus" class="w-4 h-4"></i>
                </button>
              </div>
            </div>


            <!-- ================= VIEW 2: FORMULIR PENDAFTARAN 3 STEP ================= -->
            <div x-show="mode === 'register'" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100">
              
              <!-- VISUAL PROGRESS BAR STEPPER (Sangat Jelas & Bermanfaat di Layar HP & Desktop) -->
              <div class="mb-6 border-b border-slate-200 pb-4">
                <div class="flex items-center justify-between relative px-2">
                  <div class="absolute left-6 right-6 top-4 -translate-y-1/2 h-1 bg-slate-200 -z-0"></div>
                  <div class="absolute left-6 top-4 -translate-y-1/2 h-1 bg-emerald-600 transition-all duration-300 -z-0"
                       :style="'width: ' + ((regStep - 1) * 50) + '%'"></div>

                  <!-- Step 1 Indicator -->
                  <button type="button" @click="regStep = 1" class="flex flex-col items-center z-10 bg-white px-1 focus:outline-none">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs transition-all duration-300"
                         :class="regStep >= 1 ? 'bg-emerald-700 text-white shadow-md ring-4 ring-emerald-100' : 'bg-slate-200 text-slate-500'">1</div>
                    <span class="text-[11px] font-bold mt-1" :class="regStep >= 1 ? 'text-emerald-800' : 'text-slate-400'">1. Jalur</span>
                  </button>

                  <!-- Step 2 Indicator -->
                  <button type="button" @click="nextStep(2)" class="flex flex-col items-center z-10 bg-white px-1 focus:outline-none">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs transition-all duration-300"
                         :class="regStep >= 2 ? 'bg-emerald-700 text-white shadow-md ring-4 ring-emerald-100' : 'bg-slate-200 text-slate-500'">2</div>
                    <span class="text-[11px] font-bold mt-1" :class="regStep >= 2 ? 'text-emerald-800' : 'text-slate-400'">2. Biodata</span>
                  </button>

                  <!-- Step 3 Indicator -->
                  <button type="button" @click="nextStep(3)" class="flex flex-col items-center z-10 bg-white px-1 focus:outline-none">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs transition-all duration-300"
                         :class="regStep === 3 ? 'bg-emerald-700 text-white shadow-md ring-4 ring-emerald-100' : 'bg-slate-200 text-slate-500'">3</div>
                    <span class="text-[11px] font-bold mt-1" :class="regStep === 3 ? 'text-emerald-800' : 'text-slate-400'">3. Syarat</span>
                  </button>
                </div>
              </div>

              <!-- STEP 1: PILIH JALUR & JENJANG -->
              <div x-show="regStep === 1" class="space-y-5">
                <div>
                  <h3 class="text-xl font-bold text-slate-800">Langkah 1: Pilih Jalur & Jenjang</h3>
                  <p class="text-xs text-slate-500">Pilih program pendidikan yang sesuai</p>
                </div>

                <!-- Jalur selection -->
                <div class="space-y-2">
                  <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">A. Jalur Pendaftaran</label>
                  <div class="grid grid-cols-3 gap-2">
                    <button type="button" @click="regForm.jalur = 'reguler'; regForm.kelasTarget = ''"
                            :class="regForm.jalur === 'reguler' ? 'border-emerald-600 bg-emerald-50 text-emerald-800 ring-2 ring-emerald-600' : 'border-slate-200 hover:border-slate-300 bg-white text-slate-700'"
                            class="p-3 border rounded-xl text-center text-xs font-medium transition">
                      Reguler
                    </button>
                    <button type="button" @click="regForm.jalur = 'mutasi'; regForm.kelasTarget = ''"
                            :class="regForm.jalur === 'mutasi' ? 'border-emerald-600 bg-emerald-50 text-emerald-800 ring-2 ring-emerald-600' : 'border-slate-200 hover:border-slate-300 bg-white text-slate-700'"
                            class="p-3 border rounded-xl text-center text-xs font-medium transition">
                      Mutasi
                    </button>
                    <button type="button" @click="regForm.jalur = 'inden'; regForm.kelasTarget = ''"
                            :class="regForm.jalur === 'inden' ? 'border-emerald-600 bg-emerald-50 text-emerald-800 ring-2 ring-emerald-600' : 'border-slate-200 hover:border-slate-300 bg-white text-slate-700'"
                            class="p-3 border rounded-xl text-center text-xs font-medium transition">
                      Inden
                    </button>
                  </div>
                </div>

                <!-- Jenjang Selection -->
                <div class="space-y-2">
                  <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">B. Jenjang Pendidikan</label>
                  <div class="grid grid-cols-2 gap-3">
                    <button type="button" @click="regForm.jenjang = 'SMP'; if(regForm.jalur==='mutasi') regForm.kelasTarget='Kelas 7'"
                            :class="regForm.jenjang === 'SMP' ? 'border-emerald-600 bg-emerald-50 text-emerald-800 ring-2 ring-emerald-600' : 'border-slate-200 hover:border-slate-300 bg-white text-slate-700'"
                            class="p-3.5 border rounded-xl text-left transition flex items-center space-x-3">
                      <div class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-xs">SMP</div>
                      <div>
                        <div class="text-xs font-bold">SMP Al-Umm</div>
                        <div class="text-[10px] text-slate-500">Sekolah Menengah Pertama</div>
                      </div>
                    </button>
                    <button type="button" @click="regForm.jenjang = 'MA'; if(regForm.jalur==='mutasi') regForm.kelasTarget='Kelas 10'"
                            :class="regForm.jenjang === 'MA' ? 'border-emerald-600 bg-emerald-50 text-emerald-800 ring-2 ring-emerald-600' : 'border-slate-200 hover:border-slate-300 bg-white text-slate-700'"
                            class="p-3.5 border rounded-xl text-left transition flex items-center space-x-3">
                      <div class="w-8 h-8 rounded-lg bg-teal-100 text-teal-700 flex items-center justify-center font-bold text-xs">MA</div>
                      <div>
                        <div class="text-xs font-bold">MA Al-Umm</div>
                        <div class="text-[10px] text-slate-500">Madrasah Aliyah</div>
                      </div>
                    </button>
                  </div>
                </div>

                <!-- Sub Options per Jalur -->
                <!-- Mutasi Kelas Target -->
                <template x-if="regForm.jalur === 'mutasi'">
                  <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                    <label class="block text-xs font-semibold text-slate-700">Pilih Kelas Mutasi Target:</label>
                    <select x-model="regForm.kelasTarget" class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-xs font-medium focus:ring-2 focus:ring-emerald-600">
                      <template x-if="regForm.jenjang === 'SMP'">
                        <optgroup label="Pilihan Mutasi SMP">
                          <option value="Kelas 7">Kelas 7 (Semester Genap)</option>
                          <option value="Kelas 8">Kelas 8</option>
                          <option value="Kelas 9">Kelas 9</option>
                        </optgroup>
                      </template>
                      <template x-if="regForm.jenjang === 'MA'">
                        <optgroup label="Pilihan Mutasi MA">
                          <option value="Kelas 10">Kelas 10 (Semester Genap)</option>
                          <option value="Kelas 11">Kelas 11</option>
                          <option value="Kelas 12">Kelas 12</option>
                        </optgroup>
                      </template>
                    </select>
                  </div>
                </template>

                <!-- Inden Kelas Sekarang -->
                <template x-if="regForm.jalur === 'inden'">
                  <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                    <label class="block text-xs font-semibold text-slate-700">Kelas berapa calon santri sekarang?</label>
                    <input type="text" x-model="regForm.kelasTarget" placeholder="Contoh: SD/MI Kelas 4 atau 5"
                           class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-emerald-600 outline-none">
                  </div>
                </template>

                <!-- Navigasi Step 1 -->
                <div class="flex items-center justify-between pt-4 border-t border-slate-200">
                  <button type="button" @click="switchMode('login')" class="text-xs font-medium text-slate-500 hover:text-slate-700">
                    &larr; Batal / Kembali ke Login
                  </button>
                  <button type="button" @click="nextStep(2)" class="px-5 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl text-xs font-semibold shadow transition">
                    Lanjut ke Biodata &rarr;
                  </button>
                </div>
              </div>

              <!-- STEP 2: BIODATA & NISN -->
              <div x-show="regStep === 2" class="space-y-4">
                <div>
                  <h3 class="text-xl font-bold text-slate-800">Langkah 2: Biodata & NISN</h3>
                  <p class="text-xs text-slate-500">Isi identitas diri calon santri secara akurat</p>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap Santri *</label>
                    <input type="text" x-model="regForm.namaLengkap" @input="regForm.namaLengkap = regForm.namaLengkap.toUpperCase()" required placeholder="NAMA LENGKAP SESUAI IJAZAH/AKTA"
                           class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-semibold uppercase focus:bg-white focus:ring-2 focus:ring-emerald-600 outline-none">
                  </div>

                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">NISN (Opsional)</label>
                    <input type="text" x-model="regForm.nisn" placeholder="10 DIGIT NISN"
                           class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-semibold uppercase focus:bg-white focus:ring-2 focus:ring-emerald-600 outline-none">
                  </div>

                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Jenis Kelamin *</label>
                    <select x-model="regForm.gender" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-semibold uppercase focus:bg-white focus:ring-2 focus:ring-emerald-600 outline-none">
                      <option value="LAKI-LAKI">LAKI-LAKI</option>
                      <option value="PEREMPUAN">PEREMPUAN</option>
                    </select>
                  </div>

                  <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Asal Sekolah *</label>
                    <input type="text" x-model="regForm.asalSekolah" @input="regForm.asalSekolah = regForm.asalSekolah.toUpperCase()" placeholder="CONTOH: SD NEGERI 1 MALANG / MI AL-HIDAYAH"
                           class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-semibold uppercase focus:bg-white focus:ring-2 focus:ring-emerald-600 outline-none">
                  </div>

                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nomor WhatsApp *</label>
                    <input type="text" x-model="regForm.noWA" @input="formatWAInput()" placeholder="081234567890"
                           class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-emerald-600 outline-none">
                    <p class="text-[10px] text-emerald-600 mt-0.5">* Digunakan sebagai Username & Password otomatis</p>
                  </div>

                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Email Aktif *</label>
                    <input type="email" x-model="regForm.email" placeholder="contoh@gmail.com"
                           class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-emerald-600 outline-none">
                  </div>
                </div>

                <!-- Navigasi Step 2 -->
                <div class="flex items-center justify-between pt-4 border-t border-slate-200">
                  <button type="button" @click="regStep = 1" class="text-xs font-medium text-slate-500 hover:text-slate-700">
                    &larr; Kembali
                  </button>
                  <button type="button" @click="nextStep(3)" class="px-5 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl text-xs font-semibold shadow transition">
                    Lanjut ke Persetujuan &rarr;
                  </button>
                </div>
              </div>

              <!-- STEP 3: PERSETUJUAN -->
              <div x-show="regStep === 3" class="space-y-4">
                <div>
                  <h3 class="text-xl font-bold text-slate-800">Langkah 3: Syarat & Ketentuan</h3>
                  <p class="text-xs text-slate-500">Baca dan setujui ketentuan pendaftaran PSB</p>
                </div>

                <!-- Scrollable TNC -->
                <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl max-h-36 overflow-y-auto text-[11px] text-slate-600 space-y-2 custom-scrollbar">
                  <h4 class="font-bold text-slate-800">Syarat & Ketentuan Pendaftaran PSB Al-Umm:</h4>
                  <ol class="list-decimal pl-4 space-y-1">
                    <li>Pendaftaran dinyatakan valid apabila seluruh isian formulir sesuai dengan identitas resmi.</li>
                    <li>Calon santri bersedia mengikuti ujian seleksi tes baca Al-Qur'an, akademik, dan wawancara.</li>
                    <li>Data akun pendaftaran akan dikirimkan ke email peserta yang terdaftar.</li>
                    <li>Segala bentuk kecurangan atau pemalsuan data dapat membatalkan keikutsertaan seleksi.</li>
                  </ol>
                </div>

                <!-- Checkboxes -->
                <div class="space-y-2 pt-1">
                  <label class="flex items-start space-x-2.5 cursor-pointer">
                    <input type="checkbox" x-model="regForm.agreeTnc" class="mt-0.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 w-4 h-4">
                    <span class="text-xs text-slate-700 leading-tight">Saya telah membaca & menyetujui seluruh Syarat dan Ketentuan pendaftaran.</span>
                  </label>

                  <label class="flex items-start space-x-2.5 cursor-pointer">
                    <input type="checkbox" x-model="regForm.agreeSelection" class="mt-0.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 w-4 h-4">
                    <span class="text-xs text-slate-700 leading-tight">Saya bersedia & siap mengikuti seluruh rangkaian proses seleksi hingga selesai.</span>
                  </label>

                  <label class="flex items-start space-x-2.5 cursor-pointer">
                    <input type="checkbox" x-model="regForm.agreeDataValid" class="mt-0.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 w-4 h-4">
                    <span class="text-xs text-slate-700 leading-tight">Saya menyatakan data yang diisi adalah benar & dapat dipertanggungjawabkan.</span>
                  </label>
                </div>

                <!-- Navigasi Step 3 Submit -->
                <div class="flex items-center justify-between pt-4 border-t border-slate-200">
                  <button type="button" @click="regStep = 2" class="text-xs font-medium text-slate-500 hover:text-slate-700">
                    &larr; Kembali
                  </button>
                  <button type="button" @click="submitRegister()" :disabled="isSubmitting"
                          class="px-6 py-2.5 bg-emerald-700 hover:bg-emerald-800 active:bg-emerald-900 text-white rounded-xl text-xs font-semibold shadow-lg shadow-emerald-700/20 transition flex items-center space-x-2 disabled:opacity-50">
                    <template x-if="!isSubmitting">
                      <span>Kirim Pendaftaran</span>
                    </template>
                    <template x-if="isSubmitting">
                      <span class="flex items-center space-x-1.5">
                        <svg class="animate-spin h-3.5 w-3.5 text-white" fill="none" viewBox="0 0 24 24">
                          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span>Menyimpan...</span>
                      </span>
                    </template>
                  </button>
                </div>
              </div>

            </div>


            <!-- ================= VIEW 3: SUKSES PENDAFTARAN & CETAK AKUN ================= -->
            <div x-show="mode === 'success'" x-transition:enter="transition ease-out duration-300" class="space-y-5">
              <div class="text-center">
                <div class="w-14 h-14 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mx-auto mb-3">
                  <i data-lucide="check-circle" class="w-8 h-8"></i>
                </div>
                <h3 class="text-2xl font-bold text-slate-800">Pendaftaran Akun Berhasil!</h3>
                <p class="text-xs text-slate-500 mt-1">Simpan informasi akun di bawah ini untuk masuk ke sistem PSB.</p>
              </div>

              <!-- CARD AKUN PRINTABLE -->
              <div id="print-area" class="bg-gradient-to-br from-emerald-50 to-teal-50 border-2 border-emerald-500/30 rounded-2xl p-5 space-y-4 shadow-sm">
                <div class="flex justify-between items-center border-b border-emerald-200 pb-3">
                  <div>
                    <h4 class="font-bold text-emerald-950 text-base">KARTU AKUN PSB AL-UMM</h4>
                    <p class="text-[10px] text-emerald-700">Tahun Ajaran <span x-text="config.TAHUN_AJARAN"></span></p>
                  </div>
                  <span class="px-2.5 py-1 bg-emerald-700 text-white rounded-full font-mono text-[10px] font-bold" x-text="createdUser.id"></span>
                </div>

                <div class="grid grid-cols-2 gap-3 text-xs">
                  <div>
                    <span class="text-slate-500 text-[10px] uppercase font-semibold block">Nama Santri</span>
                    <strong class="text-slate-800 font-bold" x-text="createdUser.namaLengkap"></strong>
                  </div>
                  <div>
                    <span class="text-slate-500 text-[10px] uppercase font-semibold block">Jalur & Jenjang</span>
                    <strong class="text-slate-800 font-bold" x-text="createdUser.jalur.toUpperCase() + ' - ' + createdUser.jenjang"></strong>
                  </div>
                  <div class="col-span-2 bg-white p-3 rounded-xl border border-emerald-200 grid grid-cols-2 gap-2">
                    <div>
                      <span class="text-slate-400 text-[10px] uppercase font-semibold block">Username (No WA)</span>
                      <strong class="text-emerald-700 font-mono text-sm" x-text="createdUser.username"></strong>
                    </div>
                    <div>
                      <span class="text-slate-400 text-[10px] uppercase font-semibold block">Password Login</span>
                      <strong class="text-emerald-700 font-mono text-sm" x-text="createdUser.password"></strong>
                    </div>
                  </div>
                </div>

                <p class="text-[10px] text-slate-500 italic text-center">
                  * Konfirmasi pendaftaran telah dikirim ke email <span class="font-semibold text-slate-700" x-text="createdUser.email"></span>.
                </p>
              </div>

              <!-- ACTION BUTTONS -->
              <div class="flex flex-col sm:flex-row gap-3 pt-2 no-print">
                <button type="button" @click="printAccountCard()" 
                        class="flex-1 py-2.5 px-4 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl text-xs font-semibold shadow transition flex items-center justify-center space-x-2">
                  <i data-lucide="printer" class="w-4 h-4"></i>
                  <span>Cetak / Simpan PDF</span>
                </button>
                <button type="button" @click="switchMode('login')" 
                        class="flex-1 py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold transition flex items-center justify-center space-x-2">
                  <i data-lucide="log-in" class="w-4 h-4"></i>
                  <span>Lanjut ke Halaman Login</span>
                </button>
              </div>
            </div>

          </div>
        </template>

      </div>

      <!-- ================= 4. MOBILE BOTTOM PANEL (Khusus Mobile & Tablet) ================= -->
      <div class="md:hidden bg-gradient-to-br from-emerald-900 via-emerald-800 to-teal-950 text-white p-5 sm:p-6 relative overflow-hidden border-t border-emerald-800 space-y-5">
        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:16px_16px] pointer-events-none"></div>

        <div class="relative z-10">
          <template x-if="mode === 'login'">
            <div class="space-y-3">
              <template x-if="!loadingInitial && slides.length > 0">
                <div class="space-y-3">
                  <span class="inline-block px-2.5 py-0.5 rounded-md text-[10px] uppercase font-bold tracking-wider bg-amber-400 text-amber-950" x-text="slides[activeSlide].badge"></span>
                  <h3 class="text-lg font-bold leading-snug text-white" x-text="slides[activeSlide].title"></h3>
                  <p class="text-xs text-emerald-100/80 leading-relaxed" x-text="slides[activeSlide].content"></p>
                  
                  <div class="flex items-center space-x-2 pt-1">
                    <template x-for="(slide, index) in slides" :key="index">
                      <button @click="activeSlide = index" 
                              class="h-1.5 rounded-full transition-all duration-300"
                              :class="activeSlide === index ? 'w-6 bg-emerald-300' : 'w-2 bg-emerald-700'"></button>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <template x-if="mode === 'register'">
            <div class="space-y-2">
              <h3 class="text-xs font-semibold text-emerald-200">Petunjuk Pendaftaran:</h3>
              <p class="text-xs text-emerald-100/80 leading-relaxed">
                Orang tua/wali santri dapat mendaftarkan lebih dari 1 calon santri menggunakan Nomor WhatsApp dan Email yang sama.
              </p>
            </div>
          </template>
        </div>

        <!-- FOOTER BUTTONS (Stack Vertikal di Mobile) -->
        <div class="relative z-10 pt-3 border-t border-emerald-700/50 flex flex-col gap-2.5">
          <a :href="config.BROCHURE_URL || '#'" target="_blank" 
             class="w-full inline-flex items-center justify-center space-x-2 px-4 py-2.5 rounded-xl bg-emerald-800/80 hover:bg-emerald-700 border border-emerald-600/50 text-xs font-medium text-emerald-100 transition shadow-sm">
            <i data-lucide="file-down" class="w-4 h-4 text-emerald-300"></i>
            <span>Brosur PSB</span>
          </a>
          <a :href="'https://wa.me/' + (config.HELPDESK_WA || '6281234567890')" target="_blank"
             class="w-full inline-flex items-center justify-center space-x-2 px-4 py-2.5 rounded-xl bg-emerald-800/80 hover:bg-emerald-700 border border-emerald-600/50 text-xs font-medium text-emerald-100 transition shadow-sm">
            <i data-lucide="message-circle" class="w-4 h-4 text-emerald-300"></i>
            <span>Helpdesk WA</span>
          </a>
        </div>
      </div>

    </div>
  </main>

  <script>
    function psbApp() {
      return {
        SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbyAVUkA0HuE4sip2fPT5dE2Se4JZ5RrT9mkHEaasKanuYG7dItwGRWvO9dC9AXqBJb68g/exec',
        mode: 'login', // 'login', 'register', 'success'
        regStep: 1,
        loadingInitial: true,
        isSubmitting: false,
        isPageBlocking: false,
        loadingMessage: 'Memproses...',
        showPassword: false,
        activeSlide: 0,
        slidesTimer: null,

        // Data dari backend
        config: {},
        slides: [],

        // Custom Toast Modal
        toast: {
          show: false,
          type: 'info',
          title: '',
          message: ''
        },

        // Forms
        loginForm: {
          username: '',
          password: ''
        },

        regForm: {
          jalur: 'reguler',
          jenjang: 'SMP',
          kelasTarget: '',
          namaLengkap: '',
          nisn: '',
          gender: 'Laki-laki',
          asalSekolah: '',
          noWA: '',
          email: '',
          agreeTnc: false,
          agreeSelection: false,
          agreeDataValid: false
        },

        createdUser: {
          id: '',
          username: '',
          password: '',
          namaLengkap: '',
          jalur: '',
          jenjang: '',
          email: ''
        },

        showToast: function(title, message, type) {
          this.toast.title = title;
          this.toast.message = message;
          this.toast.type = type || 'info';
          this.toast.show = true;
          setTimeout(function() {
            this.toast.show = false;
          }.bind(this), 4000);
        },

        initApp: function() {
          this.fetchInitialData();
          setTimeout(function() {
            if (window.lucide) window.lucide.createIcons();
          }, 200);
        },

        fetchInitialData: function() {
          var self = this;
          self.loadingInitial = true;

          fetch(self.SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'getInitialData', payload: {} })
          })
          .then(function(res) { return res.text(); })
          .then(function(text) {
            var resData = JSON.parse(text);
            if (resData.ok && resData.data) {
              self.config = resData.data.config || {};
              self.slides = resData.data.slides || [];
              self.startSlideshow();
            } else {
              self.showToast('Gagal Memuat Data', resData.message || 'Gagal memuat konfigurasi awal.', 'error');
            }
          })
          .catch(function(err) {
            self.showToast('Kesalahan Koneksi', 'Tidak dapat terhubung ke server PSB.', 'error');
          })
          .finally(function() {
            self.loadingInitial = false;
            setTimeout(function() {
              if (window.lucide) window.lucide.createIcons();
            }, 100);
          });
        },

        startSlideshow: function() {
          var self = this;
          if (self.slidesTimer) clearInterval(self.slidesTimer);
          if (self.slides.length > 1) {
            self.slidesTimer = setInterval(function() {
              self.activeSlide = (self.activeSlide + 1) % self.slides.length;
            }, 5000);
          }
        },

        switchMode: function(newMode) {
          if (newMode === 'login' && this.createdUser && this.createdUser.username) {
            this.loginForm.username = this.createdUser.username;
            this.loginForm.password = this.createdUser.password;
          }
          this.mode = newMode;
          this.regStep = 1;
          setTimeout(function() {
            if (window.lucide) window.lucide.createIcons();
          }, 100);
        },

        formatWAInput: function() {
          // Hanya angka
          var clean = this.regForm.noWA.replace(/[^0-9]/g, '');
          this.regForm.noWA = clean;
        },

        nextStep: function(targetStep) {
          if (targetStep === 2) {
            if (this.regForm.jalur === 'mutasi' && !this.regForm.kelasTarget) {
              this.showToast('Pilihan Belum Lengkap', 'Silakan pilih kelas mutasi target.', 'error');
              return;
            }
            if (this.regForm.jalur === 'inden' && !this.regForm.kelasTarget) {
              this.showToast('Pilihan Belum Lengkap', 'Silakan isi kelas calon santri saat ini.', 'error');
              return;
            }
            this.regStep = 2;
          } else if (targetStep === 3) {
            if (!this.regForm.namaLengkap.trim()) {
              this.showToast('Validasi Gagal', 'Nama lengkap santri wajib diisi.', 'error');
              return;
            }
            if (!this.regForm.asalSekolah.trim()) {
              this.showToast('Validasi Gagal', 'Asal sekolah wajib diisi.', 'error');
              return;
            }
            if (!this.regForm.noWA.trim() || this.regForm.noWA.length < 9) {
              this.showToast('Validasi Gagal', 'Nomor WhatsApp tidak valid (minimal 9 digit).', 'error');
              return;
            }
            if (!this.regForm.email.trim() || this.regForm.email.indexOf('@') === -1) {
              this.showToast('Validasi Gagal', 'Email tidak valid.', 'error');
              return;
            }
            this.regStep = 3;
          }
          setTimeout(function() {
            if (window.lucide) window.lucide.createIcons();
          }, 100);
        },

        submitLogin: function() {
          var self = this;
          if (!self.loginForm.username || !self.loginForm.password) {
            self.showToast('Input Lengkap', 'Isi username/WA dan password.', 'error');
            return;
          }

          self.isSubmitting = true;

          fetch(self.SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'login',
              payload: self.loginForm
            })
          })
          .then(function(res) { return res.text(); })
          .then(function(text) {
            var resData = JSON.parse(text);
            if (resData.ok && resData.data) {
              var user = resData.data;
              self.showToast('Login Berhasil', 'Selamat datang, ' + user.fullName + ' (' + user.role + ')', 'success');
            } else {
              self.showToast('Gagal Login', resData.message || 'Kredensial salah.', 'error');
            }
          })
          .catch(function(err) {
            self.showToast('Kesalahan Sistem', 'Tidak dapat melakukan proses login.', 'error');
          })
          .finally(function() {
            self.isSubmitting = false;
          });
        },

        submitRegister: function() {
          var self = this;
          if (!self.regForm.agreeTnc || !self.regForm.agreeSelection || !self.regForm.agreeDataValid) {
            self.showToast('Persetujuan Diperlukan', 'Centang ketiga pernyataan persetujuan pendaftaran.', 'error');
            return;
          }

          self.isSubmitting = true;
          self.isPageBlocking = true;
          self.loadingMessage = 'Mendaftarkan akun & mengirimkan surel...';

          fetch(self.SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'register',
              payload: self.regForm
            })
          })
          .then(function(res) { return res.text(); })
          .then(function(text) {
            var resData = JSON.parse(text);
            if (resData.ok && resData.data) {
              self.createdUser = resData.data;
              self.mode = 'success';
              self.showToast('Pendaftaran Berhasil', 'Akun berhasil dibuat.', 'success');
            } else {
              self.showToast('Gagal Mendaftar', resData.message || 'Gagal menyimpan data.', 'error');
            }
          })
          .catch(function(err) {
            self.showToast('Kesalahan Sistem', 'Terjadi kesalahan saat memproses pendaftaran.', 'error');
          })
          .finally(function() {
            self.isSubmitting = false;
            self.isPageBlocking = false;
            setTimeout(function() {
              if (window.lucide) window.lucide.createIcons();
            }, 100);
          });
        },

        printAccountCard: function() {
          window.print();
        }
      };
    }
  </script>
</body>
</html>
